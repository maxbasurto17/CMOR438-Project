name: CI Test

on:
  push:
    branches: [ "main", "add-perceptron-tests" ] # Runs on both main and your feature branch
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Download your code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install package and dependencies
      run: |
        python -m pip install --upgrade pip
        # This installs your project AND everything in pyproject.toml (like numpy)
        pip install -e .
        pip install pytest

    - name: Run the tests!
      run: |
        # Using python -m pytest is more robust for finding your local modules
        python -m pytest tests/