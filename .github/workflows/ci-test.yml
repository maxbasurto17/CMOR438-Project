name: CI Test

# Tell GitHub WHEN to run this robot
on:
  push:
    branches: [ "main" ]

# Tell GitHub WHAT to do
jobs:
  build-and-test:
    runs-on: ubuntu-latest # The robot's operating system

    steps:
    - name: Download your code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10" # Standard, stable version

    - name: Install testing tools
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Run the tests!
      run: |
        pytest tests/